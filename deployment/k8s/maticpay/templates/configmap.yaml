apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "maticpay.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "MaticPay": {
        "PaymentApiUrl": "{{ .Values.paymentApiUrl  }}",
        "NatsUrl": "{{ .Values.nats }}",
        "CallbackBaseUrl": "{{ .Values.callbackBaseUrl }}",
        "PaymentServiceBaseUrl": "{{ .Values.paymentServiceBaseUrl  }}"
      }
    }
